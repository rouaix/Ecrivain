<div class="edit-header">
    <h2><i class="fas fa-clock-rotate-left" aria-hidden="true"></i> Historique — {{ @agent.name | esc }}</h2>
    <span>
        <a href="{{ @base }}/agent/{{ @agent.id }}/run" class="button secondary" title="Exécuter">
            <i class="fas fa-play" aria-hidden="true"></i>
        </a>
        <a href="{{ @base }}/agents" class="button secondary" title="Retour aux agents">
            <i class="fas fa-arrow-left" aria-hidden="true"></i>
        </a>
    </span>
</div>

<check if="{{ empty(@runs) }}">
    <div class="panel-empty"><p>Aucune exécution enregistrée pour cet agent.</p></div>
</check>

<repeat group="{{ @runs }}" value="{{ @run }}">
    <article class="agent-run-log">
        <div class="agent-run-log-meta">
            <span><i class="fas fa-calendar" aria-hidden="true"></i> {{ @run.created_at | esc }}</span>
            <check if="{{ @run.context_type }}"><span><i class="fas fa-database" aria-hidden="true"></i> {{ @run.context_type | esc }}</span></check>
            <span><i class="fas fa-microchip" aria-hidden="true"></i> {{ @run.model | esc }}</span>
            <span title="Tokens prompt / complétion">{{ @run.prompt_tokens }} / {{ @run.completion_tokens }} tk</span>
        </div>
        <check if="{{ @run.input_excerpt }}">
            <p class="agent-run-log-input"><em>{{ @run.input_excerpt | esc }}</em></p>
        </check>
        <div class="agent-run-log-output">{{ @run.output | esc }}</div>
    </article>
</repeat>
